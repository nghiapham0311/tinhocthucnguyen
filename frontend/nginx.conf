server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache static assets built by Vite (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Danh sách ảnh Google Drive do dịch vụ drive-sync ghi ra (volume dùng chung)
    location /drive/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Khi có backend: bỏ comment để proxy API
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
